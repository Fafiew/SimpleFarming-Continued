plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

archivesBaseName = 'simplefarmingcontinued'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: rootProject.minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'simplefarming'
            mods { simplefarming { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'simplefarming'
            mods { simplefarming { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'simplefarming', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods { simplefarming { source sourceSets.main } }
        }
    }
}

// Compile the shared, loader-agnostic sources together with this module's own Forge sources.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
sourceSets.main.resources.srcDir rootProject.file('common/src/generated/resources')
sourceSets.main.resources.srcDir 'src/generated/resources'

// Keep classes and resources in one directory so Forge's dev-time mod scanner finds mods.toml.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

dependencies {
    minecraft "net.minecraftforge:forge:${rootProject.forge_version}"

    // JEI is optional: compile-only API, runtime-only for dev runs. Never packaged.
    compileOnly(fg.deobf("mezz.jei:jei-1.21.1-common-api:${rootProject.jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-1.21.1-forge-api:${rootProject.jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-1.21.1-forge:${rootProject.jei_version}"))
}

// Stamp the module version into mods.toml so it can never drift from gradle.properties.
processResources {
    inputs.property 'mod_version', rootProject.mod_version
    filesMatching('META-INF/mods.toml') {
        expand 'mod_version': rootProject.mod_version
    }
}

jar {
    archiveFileName = "simplefarmingcontinued-${rootProject.mod_version}-forge-${rootProject.minecraft_version}.jar"
    manifest {
        attributes([
            "Specification-Title"     : "simplefarming",
            "Specification-Vendor"    : "enemeez, Fafiew aka FafaHima",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "enemeez, Fafiew aka FafaHima",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
