modLoader="javafml"
loaderVersion="[52,)"
license="MIT"
issueTrackerURL="https://github.com/Fafiew/simplefarmingcontinued/issues"
[[mods]]
modId="simplefarming"
version="${mod_version}"
displayName="Simple Farming: Continued"
displayURL="https://modrinth.com/mod/simple-farming-continued"
logoFile="logo.png"
authors="Fafiew aka FafaHima (continuation); enemeez (original Simple Farming author)"
description='''An unofficial continuation of Simple Farming, bringing the original experience to newer Minecraft versions and additional mod loaders. No new features, just compatibility.'''
# Optional client-side support
[[dependencies.simplefarming]]
    modId="jei"
    type="optional"
    mandatory=false
    versionRange="[19.57.0.451,)"
    ordering="AFTER"
    side="CLIENT"
# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.simplefarming]] #optional
    # the modid of the dependency
    modId="forge" #mandatory
    # Does this dependency have to exist - if not, ordering below must be specified
    mandatory=true #mandatory
    # The version range of the dependency
    versionRange="[52,)" #mandatory
    # An ordering relationship for the dependency - BEFORE or AFTER required if the relationship is not mandatory
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT or SERVER
    side="BOTH"
# Here's another dependency
[[dependencies.simplefarming]]
    modId="minecraft"
    mandatory=true
# This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="[1.21.1,1.22)"
    ordering="NONE"
    side="BOTH"
