// Multi-loader root build for Simple Farming: Continued (Minecraft 1.21.1).
//
// Each loader lives in its own subproject and depends on the shared, loader-agnostic `common`
// project. Build everything with `./gradlew buildAll`.

group = mod_group_id
version = mod_version

subprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://libraries.minecraft.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com'
        }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds the Forge, NeoForge and Fabric distributions.'
    dependsOn ':forge:build', ':neoforge:build', ':fabric:build'
}

// Collect the three distribution jars into build/libs with consistent names.
tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Copies the loader jars into build/libs.'
    dependsOn 'buildAll'

    from(project(':forge').tasks.named('jar'))
    from(project(':neoforge').tasks.named('jar'))
    from(project(':fabric').tasks.named('remapJar'))

    // Fabric's remapJar produces the shipped artifact; the others ship their plain jar.
    exclude '**/*-dev.jar', '**/*-sources.jar'
    into layout.buildDirectory.dir('libs')
}
