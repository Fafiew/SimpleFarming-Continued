plugins {
    id 'fabric-loom' version '1.10.5'
}

archivesBaseName = 'simplefarmingcontinued'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

loom {
    // The mod needs no Fabric API. A small access widener exposes the two vanilla fields the
    // code-based biome injection rewrites; it is applied natively by Fabric Loader.
    accessWidenerPath = file("src/main/resources/simplefarming.accesswidener")

    mixin {
        defaultRefmapName = 'simplefarming.refmap.json'
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

// Compile the shared, loader-agnostic sources together with this module's own Fabric sources.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
sourceSets.main.resources.srcDir rootProject.file('common/src/generated/resources')

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // JEI is optional: compile-only API. Never packaged, never a runtime requirement.
    // The published JEI Fabric jars are remapped with a newer Loom (1.18.2) that requires a
    // Java 25 build JVM, so they are intentionally not consumed as Loom mod dependencies here.
    compileOnly "mezz.jei:jei-1.21.1-common-api:${rootProject.jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-fabric-api:${rootProject.jei_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    archiveFileName = "simplefarmingcontinued-${rootProject.mod_version}-fabric-${rootProject.minecraft_version}-dev.jar"
    manifest {
        attributes([
            "Specification-Title"     : "simplefarming",
            "Specification-Vendor"    : "enemeez, Fafiew aka FafaHima",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "enemeez, Fafiew aka FafaHima",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

remapJar {
    inputFile = jar.archiveFile
    archiveFileName = "simplefarmingcontinued-${rootProject.mod_version}-fabric-${rootProject.minecraft_version}.jar"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
