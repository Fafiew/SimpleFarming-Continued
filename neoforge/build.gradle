plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = rootProject.neoforge_version

    parchment {
        minecraftVersion = rootProject.parchment_minecraft_version
        mappingsVersion = rootProject.parchment_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        simplefarming {
            sourceSet sourceSets.main
        }
    }
}

// Compile the shared, loader-agnostic sources together with this module's own NeoForge sources.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
sourceSets.main.resources.srcDir rootProject.file('common/src/generated/resources')

dependencies {
    // JEI is optional: compile-only API, runtime-only for dev runs. Never packaged.
    compileOnly "mezz.jei:jei-1.21.1-common-api:${rootProject.jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${rootProject.jei_version}"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${rootProject.jei_version}"
}

// Stamp the module version into neoforge.mods.toml so it can never drift from gradle.properties.
processResources {
    inputs.property 'mod_version', rootProject.mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_version': rootProject.mod_version
    }
}

jar {
    archiveFileName = "simplefarmingcontinued-${rootProject.mod_version}-neoforge-${rootProject.minecraft_version}.jar"
    manifest {
        attributes([
            "Specification-Title"     : "simplefarming",
            "Specification-Vendor"    : "enemeez, Fafiew aka FafaHima",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "enemeez, Fafiew aka FafaHima",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
