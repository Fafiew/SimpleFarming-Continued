pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

rootProject.name = 'simplefarmingcontinued'

// `common/` holds loader-agnostic sources that each loader compiles in with its own mappings.
include 'forge'
include 'neoforge'
include 'fabric'
